project:
  type: website

lang: en

website:
  site-url: https://ivana-cardoso.github.io/en/
  title: "biRd blog"
  image: biRd.png
  description: "Adventures in ornithology, ecology, and statistics"
  announcement:
    icon: binoculars-fill
    dismissable: true
    content: "Science is built together. **Welcome to the biRd blog!**"
    type: primary
    position: below-navbar
  navbar:
    left:
      - text: "Posts"
        file: index.qmd
      - text: "About the author"
        file: about_author.qmd
    right:
      - text: "PT"
        href: ../index.html
      - icon: github
        href: https://github.com/Ivana-Cardoso
      - icon: rss
        href: index.xml
    logo: round_biRd.png
  page-footer: "This blog was built with [Quarto v.1.6.42](https://quarto.org/) in [R v.4.3.2](https://www.r-project.org/)"

format:
  html:
    theme:
      - theme.scss

editor: visual